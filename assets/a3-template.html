<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root {
    --fs: 18px;              /* 基准字号，可由 A-/A+ 调节 */
    --ink: #1f2933;
    --ink-soft: #52606d;
    --navy: #1e3a5f;
    --navy-deep: #16293f;
    --red: #c0392b;
    --plan: #2563a8;
    --do: #c2701e;
    --line: #dfe4ea;
    --bg-page: #f0f2f5;
    --bg-head: #f5f7f9;
    --zebra: #f8fafc;
    --radius: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: var(--fs); scroll-behavior: smooth; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
    color: var(--ink);
    background: var(--bg-page);
    line-height: 1.7;
  }

  /* ===== 顶部工具栏（sticky） ===== */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    background: linear-gradient(135deg, var(--navy-deep), var(--navy) 70%, #2b527f);
    color: #fff;
    border-bottom: 4px solid var(--red);
    box-shadow: 0 2px 10px rgba(15,30,50,.25);
  }
  .topbar-inner {
    max-width: 1680px; margin: 0 auto; padding: 14px 28px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  .topbar h1 { font-size: 1.35rem; letter-spacing: 1px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .type-tag { font-size: .8rem; background: var(--red); border-radius: 999px; padding: 3px 14px; white-space: nowrap; font-weight: normal; }
  .controls { display: flex; gap: 8px; }
  .controls button {
    font: inherit; font-size: .9rem; cursor: pointer;
    color: #fff; background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.3); border-radius: 6px; padding: 5px 12px;
    transition: background .15s;
  }
  .controls button:hover { background: rgba(255,255,255,.25); }

  /* 署名信息条 */
  .meta-bar {
    max-width: 1680px; margin: 0 auto; padding: 0 28px 12px;
    display: flex; gap: 10px; flex-wrap: wrap;
  }
  .chip {
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.22);
    border-radius: 6px; padding: 3px 12px; font-size: .85rem; color: #dbe5f0;
  }
  .chip b { color: #fff; margin-left: 6px; }

  /* ===== 分区导航（sticky 第二层） ===== */
  nav.secnav {
    position: sticky; top: 0; z-index: 99;
    background: #fff; border-bottom: 1px solid var(--line);
    box-shadow: 0 1px 6px rgba(15,30,50,.08);
  }
  .secnav-inner {
    max-width: 1680px; margin: 0 auto; padding: 8px 28px;
    display: flex; gap: 8px; overflow-x: auto;
  }
  .secnav a {
    font-size: .9rem; color: var(--ink-soft); text-decoration: none;
    padding: 4px 12px; border-radius: 999px; white-space: nowrap;
    border: 1px solid transparent; transition: all .15s;
  }
  .secnav a:hover { color: var(--navy); background: var(--bg-head); }
  .secnav a.active { color: #fff; background: var(--navy); }

  /* ===== 主体 ===== */
  .layout {
    max-width: 1680px; margin: 24px auto; padding: 0 28px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: start;
  }
  @media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } }
  .col { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
  .col-label { font-size: .85rem; letter-spacing: 3px; color: var(--ink-soft); }
  .col.left .col-label b { color: var(--plan); }
  .col.right .col-label b { color: var(--do); }

  /* ===== 分区卡片 ===== */
  .box {
    background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: 0 2px 8px rgba(15,30,50,.06);
    position: relative; overflow: hidden;
    transition: box-shadow .2s;
    scroll-margin-top: 120px;
  }
  .box:hover { box-shadow: 0 6px 18px rgba(15,30,50,.12); }
  .box::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; }
  .col.left .box::before { background: var(--plan); }
  .col.right .box::before { background: var(--do); }

  .box > h2 {
    font-size: 1.1rem; padding: 14px 18px 14px 22px;
    display: flex; align-items: center; gap: 10px;
    cursor: pointer; user-select: none;
  }
  .box > h2:hover { background: var(--bg-head); }
  .num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 1.5rem; height: 1.5rem; border-radius: 50%;
    color: #fff; font-size: .8rem; flex: none;
  }
  .col.left .num { background: var(--plan); }
  .col.right .num { background: var(--do); }
  .chev { margin-left: auto; color: var(--ink-soft); font-size: .8rem; transition: transform .2s; }
  .box.collapsed .chev { transform: rotate(-90deg); }
  .box .body { padding: 2px 20px 18px 24px; }
  .box.collapsed .body { display: none; }

  /* 超长内容：加 class="body scroll" 内部滚动，避免单区无限拉长 */
  .body.scroll { max-height: 30rem; overflow-y: auto; }
  .body.scroll::-webkit-scrollbar { width: 8px; }
  .body.scroll::-webkit-scrollbar-thumb { background: #c5cdd6; border-radius: 4px; }

  .body p { margin-bottom: 8px; }
  .body ul, .body ol { padding-left: 1.4em; }
  .body li { margin-bottom: 6px; }
  .body b { color: var(--red); }

  /* ===== 表格 ===== */
  .table-wrap { overflow-x: auto; margin: 8px 0; }
  .body table { width: 100%; border-collapse: collapse; font-size: .95rem; }
  .body th, .body td { border: 1px solid var(--line); padding: 8px 12px; text-align: left; vertical-align: top; }
  .body th { background: var(--bg-head); color: var(--navy); white-space: nowrap; }
  .body tr:nth-child(even) td { background: var(--zebra); }
  .body tr:hover td { background: #eef4fa; }

  /* ===== 强调元素 ===== */
  .kpi-row { display: flex; gap: 14px; margin: 10px 0; flex-wrap: wrap; }
  .kpi {
    flex: 1; min-width: 130px; text-align: center;
    border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 8px; background: var(--bg-head);
  }
  .kpi .val { font-size: 1.7rem; font-weight: 700; color: var(--red); line-height: 1.3; }
  .kpi .lbl { font-size: .85rem; color: var(--ink-soft); }
  .arrow { color: var(--red); font-weight: 700; }
  .tag-ok, .tag-no, .tag-try {
    display: inline-block; border-radius: 999px; padding: 1px 10px;
    font-size: .85rem; color: #fff; white-space: nowrap;
  }
  .tag-ok { background: #2e7d4f; }
  .tag-try { background: #c2701e; }
  .tag-no { background: #8a94a1; }
  .placeholder { color: #92400e; background: #fef3c7; padding: 0 4px; border-radius: 3px; }
  .why-chain .sep { color: var(--plan); font-weight: 700; padding: 0 2px; }

  footer.pagefoot {
    max-width: 1680px; margin: 10px auto 30px; padding: 14px 28px;
    font-size: .85rem; color: var(--ink-soft);
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  }
  .backtop {
    position: fixed; right: 26px; bottom: 26px; z-index: 90;
    width: 42px; height: 42px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--navy); color: #fff; font-size: 18px;
    box-shadow: 0 4px 12px rgba(15,30,50,.3);
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .backtop.show { opacity: 1; pointer-events: auto; }

  /* ===== 打印：自动回到单页A3版式 ===== */
  @media print {
    @page { size: A3 landscape; margin: 8mm; }
    html { font-size: 10.5px; }
    body { background: #fff; }
    .controls, nav.secnav, .backtop { display: none !important; }
    .topbar { position: static; box-shadow: none; }
    .layout { margin: 6mm 0 0; padding: 0; gap: 4mm; grid-template-columns: 1fr 1fr !important; }
    .col { gap: 4mm; }
    .box { box-shadow: none; break-inside: avoid; border-radius: 0; }
    .box.collapsed .body { display: block; }   /* 打印时强制展开 */
    .body.scroll { max-height: none; overflow: visible; }
    .box > h2 { padding: 2mm 3mm 2mm 4mm; }
    .box .body { padding: 0 3mm 3mm 4mm; }
    .chev { display: none; }
    footer.pagefoot { padding: 2mm 0; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <h1>{{TITLE}}<span class="type-tag">{{TYPE_LABEL}}</span></h1>
    <div class="controls">
      <button onclick="fontSize(-1)" title="缩小字号">A-</button>
      <button onclick="fontSize(1)" title="放大字号">A+</button>
      <button onclick="toggleAll()" id="toggleAllBtn">收起全部</button>
      <button onclick="window.print()">打印 A3</button>
    </div>
  </div>
  <div class="meta-bar">
    <span class="chip">实践人<b>{{AUTHOR}}</b></span>
    <span class="chip">A3教练<b>{{COACH}}</b></span>
    <span class="chip">部门<b>{{DEPARTMENT}}</b></span>
    <span class="chip">日期<b>{{DATE}}</b></span>
    <span class="chip">版本<b>{{VERSION}}</b></span>
  </div>
</div>

<nav class="secnav"><div class="secnav-inner" id="secnav"></div></nav>

<div class="layout">
  <div class="col left">
    <div class="col-label"><b>PLAN</b> · 把握现状与根因</div>
    <!-- 左栏分区：每区一个 .box；id 用 sec-N；超长内容给 body 加 scroll 类 -->
    <section class="box" id="sec-1">
      <h2><span class="num">1</span>背景 / 目的<span class="chev">▼</span></h2>
      <div class="body">
        <p>{{SECTION_CONTENT}}</p>
      </div>
    </section>
  </div>
  <div class="col right">
    <div class="col-label"><b>DO / CHECK / ACT</b> · 对策与落地</div>
    <!-- 右栏分区；表格外层包 <div class="table-wrap"> 以支持横向滚动 -->
    <section class="box" id="sec-5">
      <h2><span class="num">5</span>解决方案（对策）<span class="chev">▼</span></h2>
      <div class="body">
        <ul><li>{{SECTION_CONTENT}}</li></ul>
      </div>
    </section>
  </div>
</div>

<footer class="pagefoot">
  <span>A3 Report · 丰田A3方法论</span>
  <span>屏幕交互模式 · 点击"打印 A3"输出单页A3横向版式</span>
</footer>

<button class="backtop" id="backtop" onclick="scrollTo({top:0,behavior:'smooth'})" title="回到顶部">↑</button>

<script>
  // 字号调节
  let fs = 18;
  function fontSize(d) {
    fs = Math.min(24, Math.max(14, fs + d));
    document.documentElement.style.setProperty('--fs', fs + 'px');
  }
  // 分区折叠
  document.querySelectorAll('.box > h2').forEach(h => {
    h.addEventListener('click', () => h.parentElement.classList.toggle('collapsed'));
  });
  function toggleAll() {
    const boxes = document.querySelectorAll('.box');
    const anyOpen = [...boxes].some(b => !b.classList.contains('collapsed'));
    boxes.forEach(b => b.classList.toggle('collapsed', anyOpen));
    document.getElementById('toggleAllBtn').textContent = anyOpen ? '展开全部' : '收起全部';
  }
  // 自动生成分区导航 + 滚动高亮
  const nav = document.getElementById('secnav');
  const boxes = document.querySelectorAll('.box[id]');
  boxes.forEach(b => {
    const a = document.createElement('a');
    a.href = '#' + b.id;
    a.textContent = b.querySelector('h2').textContent.replace('▼','').trim();
    nav.appendChild(a);
  });
  const links = nav.querySelectorAll('a');
  const io = new IntersectionObserver(es => {
    es.forEach(e => {
      if (e.isIntersecting) {
        links.forEach(l => l.classList.toggle('active', l.hash === '#' + e.target.id));
      }
    });
  }, { rootMargin: '-30% 0px -60% 0px' });
  boxes.forEach(b => io.observe(b));
  // 回到顶部
  addEventListener('scroll', () => {
    document.getElementById('backtop').classList.toggle('show', scrollY > 400);
  });
</script>
</body>
</html>
